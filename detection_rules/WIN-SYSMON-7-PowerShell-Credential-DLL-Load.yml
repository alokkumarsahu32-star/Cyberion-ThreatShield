title: PowerShell Loading Credential Access Related DLLs
id: 8d2f6a91-4c73-4b10-9e25-6a1d8f3c7b42
name: powershell_credential_dll_load
status: experimental
description: Detects PowerShell processes loading DLLs observed before LSASS access in selected credential dumping dataset scenarios. This rule is intended as a building block for temporal correlation and is not independently proof of malicious activity.
author: Cyberion ThreatShield
date: 2026/11/03
logsource:
    product: windows
    category: image_load
detection:
    selection_process:
        Image|endswith: '\powershell.exe'
    selection_dll:
        ImageLoaded|endswith:
            - '\cryptdll.dll'
            - '\samlib.dll'
            - '\hid.dll'
            - '\WinSCard.dll'
    condition: selection_process and selection_dll
falsepositives:
    - Legitimate PowerShell scripts using Windows authentication or smart-card libraries
    - Authorized administrative and security tools
level: low

