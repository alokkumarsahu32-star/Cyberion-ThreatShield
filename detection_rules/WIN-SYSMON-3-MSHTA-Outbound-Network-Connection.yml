title: MSHTA Outbound Network Connection
id: 8c4f2a71-6d93-4b15-a2e8-7f1c5d9b3046
name: mshta_outbound_network_connection
status: experimental
description: Detects outbound network connections initiated by mshta.exe using Sysmon Event ID 3. MSHTA network activity can be associated with remote HTA execution and malicious payload delivery.
author: Cyberion ThreatShield
date: 2026/11/08
logsource:
    product: windows
    category: network_connection
detection:
    selection:
        EventID: 3
        Image|endswith: '\mshta.exe'
        Initiated: 'true'
    condition: selection
falsepositives:
    - Authorized HTA applications communicating with remote services
    - Legitimate administrative or software deployment activity
level: high
tags:
    - attack.execution
    - attack.t1218.005
    - attack.command_and_control
