title: Windows Script Host Launching PowerShell With Execution Policy Bypass
id: 6a2f9c41-8d73-4e50-b192-5c7a3f6d8014
name: win_sysmon_embedded_powershell_execution_policy_bypass
status: experimental
description: Detects wscript.exe process creation events whose command line embeds PowerShell with an execution policy bypass argument. This targets observed script-host-mediated PowerShell execution and does not cover all PowerShell launch methods.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1562/001/
author: Cyberion ThreatShield
date: 2026/11/08
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense-evasion
    - attack.t1562.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_wscript:
        Image|endswith: '\wscript.exe'
    selection_embedded_powershell:
        CommandLine|contains: 'powershell'
    selection_exec_bypass:
        CommandLine|contains: '-exec bypass'
    selection_executionpolicy_bypass:
        CommandLine|contains: '-executionpolicy bypass'
    selection_ep_bypass:
        CommandLine|contains: '-ep bypass'
    condition: selection_wscript and selection_embedded_powershell and (selection_exec_bypass or selection_executionpolicy_bypass or selection_ep_bypass)
falsepositives:
    - Authorized administrative scripts that intentionally launch PowerShell with execution policy bypass
    - Software deployment or troubleshooting scripts using Windows Script Host
level: medium
