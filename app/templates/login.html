
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Cyberion ThreatShield</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <style>
        .login-wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: #131c30;
            border: 1px solid #27334b;
            border-radius: 14px;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            color: #edf2ff;
            background: #0b1020;
            border: 1px solid #27334b;
            border-radius: 7px;
        }
        .login-card button {
            width: 100%;
            padding: 13px;
            color: white;
            background: #1768a6;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
        }
        .error { color: #ff9292; }
        .login-card label { color: #cbd5e1; }
    </style>
</head>
<body>
    <main class="login-wrap">
        <section class="login-card">
            <p class="eyebrow">CYBERION DEFENSE LABS</p>
            <h1>ThreatShield</h1>
            <p class="muted">Sign in to your analyst workspace.</p>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form method="post" action="/login">
                <label for="username">Username</label>
                <input id="username" name="username"
                       autocomplete="username" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password"
                       autocomplete="current-password" required>

                <button type="submit">Sign In</button>
            </form>
        </section>
    </main>
</body>
</html>
